#
# Builds and tests the connector and the client SDK on every push and pull
# request. The contract tests against the real LeonsDB server run in the
# server's own pipeline, which has the server binary.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PROTOC_VERSION: "36.2"

jobs:
  protocol:
    name: Protocol and Go SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: proto/go.mod
          cache-dependency-path: proto/go.sum

      - name: Install protoc and Go plugins
        run: |
          curl -sSL -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          sudo unzip -q -o /tmp/protoc.zip -d /usr/local
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2

      - name: Generated code is up to date
        run: |
          scripts/gen-proto.sh
          if ! git diff --exit-code -- proto/gen || [ -n "$(git status --porcelain -- proto/gen)" ]; then
            echo "generated code is out of date: run scripts/gen-proto.sh and commit the result"; exit 1
          fi

      - name: Format, vet, build
        working-directory: proto
        run: |
          test -z "$(gofmt -l wireclient)" || { gofmt -l wireclient; exit 1; }
          go vet ./...
          go build ./...

  connector:
    name: Connector (Java)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew build --console=plain

      - name: Upload plugin jar
        uses: actions/upload-artifact@v7
        with:
          name: LeonsDB-Paper
          path: paper/build/libs/LeonsDB-Paper-*.jar
          if-no-files-found: error

  licenses:
    name: License compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: SPDX headers
        run: scripts/check-spdx.sh

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Java dependency licenses
        # The license plugin does not support parallel or cached configuration.
        run: ./gradlew checkLicense generateLicenseReport --no-parallel --no-configuration-cache --console=plain
