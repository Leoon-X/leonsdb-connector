[versions]
grpc = "1.85.1"
protobuf = "4.36.2"
protoc = "4.36.2"
junit = "6.1.3"
paper = "1.21.11-R0.1-SNAPSHOT"
# The Velocity API the proxy plugin compiles against: the oldest it
# supports (Java 17 bytecode), so it also loads on proxies on Java 21.
velocity = "3.4.0"
# The importer's sources. MySQL and H2 drivers are not shipped (their
# licenses are copyleft): the importer downloads them when a plan needs them
# (Drivers.java pins the versions); the build only uses them in tests.
sqlite-jdbc = "3.53.2.1"
mongodb = "5.13.0"
snakeyaml = "2.6"
mysql-connector-j = "26.7.0"
h2 = "2.5.250"

[libraries]
grpc-api = { module = "io.grpc:grpc-api", version.ref = "grpc" }
grpc-stub = { module = "io.grpc:grpc-stub", version.ref = "grpc" }
grpc-protobuf = { module = "io.grpc:grpc-protobuf", version.ref = "grpc" }
grpc-netty-shaded = { module = "io.grpc:grpc-netty-shaded", version.ref = "grpc" }
grpc-inprocess = { module = "io.grpc:grpc-inprocess", version.ref = "grpc" }
grpc-protoc-gen = { module = "io.grpc:protoc-gen-grpc-java", version.ref = "grpc" }
protobuf-java = { module = "com.google.protobuf:protobuf-java", version.ref = "protobuf" }
protoc = { module = "com.google.protobuf:protoc", version.ref = "protoc" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper" }
velocity-api = { module = "com.velocitypowered:velocity-api", version.ref = "velocity" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite-jdbc" }
mongodb-driver-sync = { module = "org.mongodb:mongodb-driver-sync", version.ref = "mongodb" }
snakeyaml = { module = "org.yaml:snakeyaml", version.ref = "snakeyaml" }
mysql-connector-j = { module = "com.mysql:mysql-connector-j", version.ref = "mysql-connector-j" }
h2 = { module = "com.h2database:h2", version.ref = "h2" }

[plugins]
protobuf = { id = "com.google.protobuf", version = "0.10.0" }
shadow = { id = "com.gradleup.shadow", version = "9.6.1" }
license-report = { id = "com.github.jk1.dependency-license-report", version = "3.1.4" }
