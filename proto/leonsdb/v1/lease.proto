syntax = "proto3";

package leonsdb.v1;

import "leonsdb/v1/data.proto";

option go_package = "github.com/Leoon-X/leonsdb-connector/proto/gen/go/leonsdb/v1;leonsdbv1";
option java_multiple_files = true;
option java_package = "com.leonsdb.proto.v1";
option java_outer_classname = "LeaseProto";

// LeaseService makes sure only one Minecraft server owns a player's data at
// a time, which stops server-switch dupes.
//
// A connector (one "holder") acquires a lease when a player joins and
// releases it when they leave. Every acquisition increases the player's
// epoch, and the server only accepts writes to that player's records that
// carry the current owner's epoch. Leases expire if not renewed, so a
// crashed server does not lock players out.
//
// When another server wants a player that is still owned (a server
// switch), the owner is told through Watch to save and release, and the
// new server's Acquire waits until it has.
service LeaseService {
  // Acquire takes ownership of a player, waiting up to wait_ms for the
  // current owner to hand over. Fails with FAILED_PRECONDITION (reason
  // OWNED_ELSEWHERE) if the owner does not release in time. Acquiring a
  // player the holder already owns returns the current epoch.
  rpc Acquire(AcquireLeaseRequest) returns (AcquireLeaseResponse);

  // Renew extends all leases of a holder. Call it every ttl/3.
  rpc Renew(RenewLeasesRequest) returns (RenewLeasesResponse);

  // Release gives up ownership of a player, after all its data is saved.
  rpc Release(ReleaseLeaseRequest) returns (ReleaseLeaseResponse);

  // Watch streams events for a holder: handover requests, lost leases and
  // requests to take part in other servers' transactions.
  rpc Watch(WatchLeasesRequest) returns (stream LeaseEvent);

  // Prepared answers a KIND_PREPARE event: this holder reserved the
  // player's data and says what to write, or refuses.
  rpc Prepared(PreparedRequest) returns (PreparedResponse);

  // GetTransactionOutcome tells a holder that prepared a write whether the
  // transaction committed, for when the KIND_OUTCOME event was missed.
  rpc GetTransactionOutcome(GetTransactionOutcomeRequest) returns (GetTransactionOutcomeResponse);

  // Expect says a player is about to join another server, so the switch
  // waits less. A proxy sends it just before it moves the player. The
  // owner, if any, is told with KIND_SWITCH_EXPECTED to save the player
  // now, and the player's records are read into memory. Ownership does not
  // change: the owner keeps the player, and keeps saving, until the new
  // server asks for them, so a switch that fails loses nothing.
  rpc Expect(ExpectRequest) returns (ExpectResponse);

  // TakeBack is Acquire for a player still connected to a server that
  // handed them over for a switch that did not complete. It waits up to
  // wait_ms until nobody owns the player, but never asks the owner to hand
  // over, and lets every waiting Acquire go first, so it never takes a
  // player from a switch that is still in progress. Fails like Acquire if
  // the player is still owned (or wanted) elsewhere when the wait ends.
  rpc TakeBack(AcquireLeaseRequest) returns (AcquireLeaseResponse);

  // Joined says a player this holder owns has joined it: the login is over
  // and they are in the game. A holder that asked with confirms_join calls
  // it for every player it owns, once they have joined.
  rpc Joined(JoinedRequest) returns (JoinedResponse);

  // GetOwner says who owns a player now and whether the player has joined
  // that server. A server that handed a player over and still has them
  // connected uses it to tell a switch still in progress (the new server
  // owns the player but they have not joined it yet) from a player who
  // logged in somewhere else.
  rpc GetOwner(GetOwnerRequest) returns (GetOwnerResponse);
}

message AcquireLeaseRequest {
  // The player's UUID, 16 bytes.
  bytes player = 1;
  // Random identifier of the connector instance, generated at its start.
  string holder_id = 2;
  // Readable name of the holder, for example the Minecraft server's name.
  string holder_name = 3;
  // How long to wait for the current owner to hand over, at most 30000.
  uint32 wait_ms = 4;
  // Also read the player's record in each of these player collections
  // ("namespace.collection") once ownership is granted, so that joining
  // takes one round trip.
  repeated string load = 5;
  // This holder will call Joined once the player has joined it.
  bool confirms_join = 7;
}

message AcquireLeaseResponse {
  // Include this epoch in every write to the player's records.
  uint64 epoch = 1;
  // Renew before this many milliseconds have passed.
  uint32 ttl_ms = 2;
  // The records asked for with load that exist, read after the grant.
  repeated Record records = 3;
  // True when the server handled load. Servers before 0.9 ignore it and
  // return no records; a client must then read the records itself.
  bool loaded = 4;
}

message RenewLeasesRequest {
  string holder_id = 1;
}

message RenewLeasesResponse {
  // Players this holder no longer owns (taken over after expiring).
  repeated bytes lost = 1;
  // Players another server is waiting for. Also sent through Watch; listed
  // here too in case an event was missed.
  repeated bytes handover_requested = 2;
  uint32 ttl_ms = 3;
}

message ReleaseLeaseRequest {
  bytes player = 1;
  string holder_id = 2;
  uint64 epoch = 3;
}

message ReleaseLeaseResponse {
  // False if the holder did not own the player (any more).
  bool released = 1;
}

message WatchLeasesRequest {
  string holder_id = 1;
  string holder_name = 2;
}

message LeaseEvent {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    // Another server wants this player: save their data and release.
    KIND_HANDOVER_REQUESTED = 1;
    // This holder no longer owns the player; stop writing their data.
    KIND_LOST = 2;
    // Another server's transaction changes this player. Reserve their
    // data, apply operations to it and answer with Prepared within two
    // seconds; until the outcome is known, save nothing else of that record.
    KIND_PREPARE = 3;
    // A transaction this holder prepared for committed or was abandoned.
    KIND_OUTCOME = 4;
    // The player is about to switch to the server named in requested_by
    // (see Expect). Save their changes now, so the handover that follows
    // has little left to write. Keep the player: this is only a hint.
    KIND_SWITCH_EXPECTED = 5;
  }
  Kind kind = 1;
  bytes player = 2;
  // Name of the server that asked for the player, if any.
  string requested_by = 3;

  // For KIND_PREPARE and KIND_OUTCOME: which transaction, and which of its
  // writes.
  bytes transaction_id = 4;
  uint32 write_index = 5;
  // For KIND_PREPARE: the record and the operations to apply to it.
  RecordRef ref = 6;
  repeated Operation operations = 7;
  // For KIND_PREPARE: conditions to check against the live data first;
  // refuse with reason CONDITION_FAILED if one does not hold.
  repeated Condition conditions = 10;
  // For KIND_OUTCOME.
  bool committed = 8;
  // For KIND_OUTCOME when committed: the record's new version.
  uint64 version = 9;
  // For KIND_PREPARE and KIND_OUTCOME: identifies this attempt at the
  // transaction. A retried transaction is prepared again under a new id;
  // answers and outcomes always refer to one attempt.
  bytes prepare_id = 11;
}

message PreparedRequest {
  string holder_id = 1;
  bytes transaction_id = 2;
  uint32 write_index = 3;
  bytes prepare_id = 10;
  // False to refuse, with a reason and a message for the other server.
  bool ok = 4;
  string refusal_reason = 5;
  string refusal_message = 6;
  // When ok: what to write, as this holder would write it itself: its
  // epoch, the version it has, and operations that bring the stored record
  // to the holder's live data with the requested operations applied.
  // Without expected_version (a record this holder does not cache), the
  // operations apply to the stored record as it is.
  uint64 epoch = 7;
  optional uint64 expected_version = 8;
  repeated Operation operations = 9;
}

message PreparedResponse {}

message GetTransactionOutcomeRequest {
  bytes transaction_id = 1;
  // The attempt this holder prepared.
  bytes prepare_id = 2;
}

message GetTransactionOutcomeResponse {
  enum Outcome {
    OUTCOME_UNSPECIFIED = 0;
    // Still being decided: ask again shortly.
    OUTCOME_PENDING = 1;
    OUTCOME_COMMITTED = 2;
    // Not committed, and never will be.
    OUTCOME_ABORTED = 3;
  }
  Outcome outcome = 1;
  // When committed: the version of each written record after the commit.
  repeated uint64 versions = 2;
}


message ExpectRequest {
  // The player's UUID, 16 bytes.
  bytes player = 1;
  // Name of the server the player is about to join, as its connector
  // calls itself (server-name); empty for a first join.
  string target = 2;
}

message ExpectResponse {
  // True if a server owned the player and was told.
  bool owner_told = 1;
}

message JoinedRequest {
  // The player's UUID, 16 bytes.
  bytes player = 1;
  string holder_id = 2;
  // The epoch of the lease the player joined under.
  uint64 epoch = 3;
}

message JoinedResponse {
  // False if the holder did not own the player with this epoch (any more).
  bool confirmed = 1;
}

message GetOwnerRequest {
  // The player's UUID, 16 bytes.
  bytes player = 1;
}

message GetOwnerResponse {
  // False if no server owns the player now; the other fields are then empty.
  bool owned = 1;
  string holder_id = 2;
  string holder_name = 3;
  // The owner said it calls Joined. If false, whether the player has joined
  // it is unknown: it runs a connector from before join confirmations.
  bool confirms_join = 4;
  // The owner confirmed the player has joined it.
  bool joined = 5;
  // How long ago the owner confirmed it, in milliseconds.
  uint64 joined_ms_ago = 6;
}
