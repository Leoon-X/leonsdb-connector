syntax = "proto3";

package leonsdb.v1;

option go_package = "github.com/Leoon-X/leonsdb-connector/proto/gen/go/leonsdb/v1;leonsdbv1";
option java_multiple_files = true;
option java_package = "com.leonsdb.proto.v1";
option java_outer_classname = "AdminProto";

// AdminService manages access to the server. Every method requires a token
// with the ADMIN role.
service AdminService {
  // CreateToken creates an access token. The secret is returned once and
  // never stored by the server; only a hash of it is kept.
  rpc CreateToken(CreateTokenRequest) returns (CreateTokenResponse);

  // ListTokens lists all tokens, without their secrets.
  rpc ListTokens(ListTokensRequest) returns (ListTokensResponse);

  // RevokeToken deletes a token. Requests using it fail from then on.
  rpc RevokeToken(RevokeTokenRequest) returns (RevokeTokenResponse);

  // PurgePlayer permanently erases a player's data: their records in every
  // player collection and all of their history. The player must not be
  // online. Backups made before keep the data until they are deleted.
  rpc PurgePlayer(PurgePlayerRequest) returns (PurgePlayerResponse);

  // CreateBackup makes a backup now and returns once it is stored and
  // verified.
  rpc CreateBackup(CreateBackupRequest) returns (CreateBackupResponse);

  // ListBackups lists the stored backups, newest first.
  rpc ListBackups(ListBackupsRequest) returns (ListBackupsResponse);

  // GetBackupStatus tells how backups are set up, whether one is running,
  // and how the last ones went.
  rpc GetBackupStatus(GetBackupStatusRequest) returns (GetBackupStatusResponse);
}

message PurgePlayerRequest {
  // The player's UUID, 16 bytes.
  bytes player = 1;
}

message PurgePlayerResponse {
  // Records removed, one per player collection the player had data in.
  uint32 records = 1;
  uint64 history_entries = 2;
  // Entries of the change log that mentioned the player's data.
  uint64 changes = 3;
}

message CreateBackupRequest {}

message CreateBackupResponse {
  Backup backup = 1;
}

message ListBackupsRequest {}

message ListBackupsResponse {
  repeated Backup backups = 1;
}

message GetBackupStatusRequest {}

message GetBackupStatusResponse {
  BackupStatus status = 1;
}

// BackupStatus is the state of the backups. Times are milliseconds since
// the Unix epoch, 0 when there is none. The failures are kept in memory
// only: a restart forgets them.
message BackupStatus {
  // False when backups.dir is not set: no backups are made.
  bool configured = 1;
  // Where backups are stored on the server's machine.
  string dir = 2;
  // How often a backup is made automatically.
  uint32 interval_hours = 3;
  // How many backups are kept.
  uint32 keep = 4;
  bool encrypted = 5;
  // Backups are also uploaded to S3-compatible storage.
  bool upload = 6;
  // When the backup running now started; 0 when none is running.
  int64 running_since = 7;
  // When the next automatic backup is due.
  int64 next_at = 8;
  // The newest backup that was made (also after a restart, from the files).
  int64 last_success_at = 9;
  string last_success_name = 10;
  // The last backup that failed, and why.
  int64 last_failure_at = 11;
  string last_failure = 12;
  // The last upload that failed, and why; the backup itself was made.
  int64 last_upload_failure_at = 13;
  string last_upload_failure = 14;
  // Since when backups are overdue: no backup was made for the interval
  // plus an hour (counted from the start when there is none yet). 0 when
  // they are not.
  int64 overdue_since = 15;
}

message Backup {
  // File name, for example leonsdb-20261024T140000Z.tar.zst.age.
  string name = 1;
  // Milliseconds since the Unix epoch.
  int64 created_at = 2;
  uint64 size_bytes = 3;
  bool encrypted = 4;
  // Where copies are kept: "local", "s3" or both.
  repeated string locations = 5;
}

enum Role {
  ROLE_UNSPECIFIED = 0;
  // Everything, including managing tokens.
  ROLE_ADMIN = 1;
  // Read and write data and create collections. One per Minecraft server.
  ROLE_SERVER = 2;
  // Read data only.
  ROLE_READ_ONLY = 3;
  // Only what the token's grants allow, for websites, Discord bots and
  // stores. Cannot create collections or own players.
  ROLE_API = 4;
  // Only tells LeonsDB which server a player is about to join (Expect), for
  // proxies such as Velocity. Cannot read or write data.
  ROLE_PROXY = 5;
}

// Access is what a grant allows.
enum Access {
  ACCESS_UNSPECIFIED = 0;
  ACCESS_READ = 1;
  ACCESS_WRITE = 2;
  ACCESS_READ_WRITE = 3;
}

// Grant gives an API token access to some collections, and optionally only
// to some of their fields.
message Grant {
  // A namespace name, or "*" for every namespace.
  string namespace = 1;
  // A collection name, or "*" for every collection of the namespace.
  string collection = 2;
  Access access = 3;
  // The fields the token may see and change. Empty means every field.
  // Fields not listed are removed from every record the token reads.
  repeated string fields = 4;
}

message Token {
  // Public identifier, part of the token string.
  string id = 1;
  // Human-readable label, for example "lobby-1".
  string name = 2;
  Role role = 3;
  // Creation time in milliseconds since the Unix epoch.
  int64 created_at = 4;
  // What a ROLE_API token may access.
  repeated Grant grants = 5;
  // Requests per second allowed from each client address; 0 means no limit.
  uint32 rate_limit = 6;
  // When the token was last used, in milliseconds since the Unix epoch; 0
  // if it has not been used since the server began recording it. It is
  // saved once a minute, so after a restart it can be up to a minute early.
  int64 last_used_at = 7;
}

message CreateTokenRequest {
  // 1 to 64 characters.
  string name = 1;
  Role role = 2;
  // Required for ROLE_API (at least one), not allowed for other roles.
  repeated Grant grants = 3;
  // Requests per second allowed from each client address. 0 means the
  // default: 20 for ROLE_API, no limit for the other roles.
  uint32 rate_limit = 4;
}

message CreateTokenResponse {
  Token token = 1;
  // The full token to give to the client. Shown only this once.
  string secret = 2;
}

message ListTokensRequest {}

message ListTokensResponse {
  repeated Token tokens = 1;
}

message RevokeTokenRequest {
  string id = 1;
}

message RevokeTokenResponse {
  // False if no token had this id.
  bool existed = 1;
}
